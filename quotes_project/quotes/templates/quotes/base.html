<!DOCTYPE html>
<html>
<head>
</head>
<body>
{% if user.is_authenticated %}

    <form action="/accounts/logout/" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit">Logout</button>
   
{% else %}
    <a href="/accounts/login/">Login</a>


{% endif %}
    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
