{% extends "quotes/base.html" %}

{% block content %}

<h2>Add Author</h2>

<form method="post">
    {% csrf_token %}

    <p>Name:<br>
    <input type="text" name="fullname"></p>

    <p>Born date:<br>
    <input type="text" name="born_date"></p>

    <p>Location:<br>
    <input type="text" name="born_location"></p>

    <p>Description:<br>
    <textarea name="description"></textarea></p>

    <button type="submit">Add</button>
</form>

{% endblock %}
